# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-acceso"
BBFILE_PATTERN_meta-acceso = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-acceso = "6"

LAYERDEPENDS_meta-acceso = "core"
LAYERSERIES_COMPAT_meta-acceso = "wrynose"
